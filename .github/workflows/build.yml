name: Build & Upload

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
          sudo xcode-select -s "/Applications/$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set up ASC API Key
        env:
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_CONTENT" | base64 -D > ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project CatSoroban.xcodeproj \
            -scheme CatSoroban

      - name: Archive
        run: |
          xcodebuild archive \
            -project CatSoroban.xcodeproj \
            -scheme CatSoroban \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/CatSoroban.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=83VGKGSQUH \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
            -authenticationKeyID WDXGY9WX55 \
            -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/CatSoroban.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist export_options.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
            -authenticationKeyID WDXGY9WX55 \
            -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/export/*.ipa \
            --apiKey WDXGY9WX55 \
            --apiIssuer 2be0734f-943a-4d61-9dc9-5d9045c46fec

      - name: Find screenshot simulators
        run: |
          IPHONE_ID=$(xcrun simctl list devices available | grep "iPhone 17 Pro Max" | head -1 | grep -oE '[A-F0-9-]{36}')
          if [ -z "$IPHONE_ID" ]; then
            IPHONE_ID=$(xcrun simctl list devices available | grep "iPhone" | grep "Pro Max" | head -1 | grep -oE '[A-F0-9-]{36}')
          fi
          IPAD_ID=$(xcrun simctl list devices available | grep "iPad Pro" | grep "13" | head -1 | grep -oE '[A-F0-9-]{36}')
          if [ -z "$IPAD_ID" ]; then
            IPAD_ID=$(xcrun simctl list devices available | grep "iPad" | head -1 | grep -oE '[A-F0-9-]{36}')
          fi
          test -n "$IPHONE_ID"
          test -n "$IPAD_ID"
          echo "IPHONE_ID=$IPHONE_ID" >> "$GITHUB_ENV"
          echo "IPAD_ID=$IPAD_ID" >> "$GITHUB_ENV"

      - name: Build screenshot apps
        run: |
          xcodebuild build \
            -project CatSoroban.xcodeproj \
            -scheme CatSoroban \
            -configuration Debug \
            -destination "id=$IPHONE_ID" \
            -derivedDataPath build/DerivedData-iPhone \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild build \
            -project CatSoroban.xcodeproj \
            -scheme CatSoroban \
            -configuration Debug \
            -destination "id=$IPAD_ID" \
            -derivedDataPath build/DerivedData-iPad \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Capture and upload real app screenshots
        run: |
          set -euo pipefail
          mkdir -p screenshots

          capture() {
            local device_id="$1"
            local app_path="$2"
            local prefix="$3"

            xcrun simctl boot "$device_id" || true
            xcrun simctl bootstatus "$device_id" -b
            xcrun simctl install "$device_id" "$app_path"

            xcrun simctl terminate "$device_id" com.snarfnet.cutesoroban || true
            xcrun simctl launch "$device_id" com.snarfnet.cutesoroban
            sleep 4
            xcrun simctl io "$device_id" screenshot "screenshots/${prefix}_01.png"

            xcrun simctl terminate "$device_id" com.snarfnet.cutesoroban || true
            xcrun simctl launch "$device_id" com.snarfnet.cutesoroban --screenshot-preset=practice
            sleep 4
            xcrun simctl io "$device_id" screenshot "screenshots/${prefix}_02.png"

            xcrun simctl terminate "$device_id" com.snarfnet.cutesoroban || true
            xcrun simctl launch "$device_id" com.snarfnet.cutesoroban --screenshot-preset=full
            sleep 4
            xcrun simctl io "$device_id" screenshot "screenshots/${prefix}_03.png"
          }

          IPHONE_APP=$(find build/DerivedData-iPhone -name "CatSoroban.app" -type d | head -1)
          IPAD_APP=$(find build/DerivedData-iPad -name "CatSoroban.app" -type d | head -1)
          capture "$IPHONE_ID" "$IPHONE_APP" iphone_67
          capture "$IPAD_ID" "$IPAD_APP" ipad_129

          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install PyJWT requests cryptography
          python scripts/upload_screenshots.py screenshots

      - name: Submit for App Review
        env:
          ASC_P8_PATH: ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8
        run: |
          source .venv/bin/activate
          python scripts/setup_metadata.py
          python scripts/submit.py "${{ github.run_number }}"
